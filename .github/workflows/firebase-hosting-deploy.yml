name: Deploy to Firebase Hosting on push
on:
  push:
    branches:
      - main  # Eger branch adyňyz master bolsa, master ýazyň

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # VPN Gate-den iň täze CSV-ni awtomatiki göçürip public/ papka goýýar:
      - name: Fetch VPN Gate CSV
        run: |
          mkdir -p public
          curl -s "http://www.vpngate.net/api/iphone/" -o public/vpngate.csv

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISASTER_2AD1A }}'
          channelId: live
          projectId: disaster-2ad1a
